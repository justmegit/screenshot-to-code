server {
    listen 80;
    server_name _;

    # Screenshots and video uploads travel in the websocket payload; the
    # export/screenshot endpoints still accept sizeable POST bodies.
    client_max_body_size 64m;

    # Credentials come from BASIC_AUTH_HTPASSWD (see 40-htpasswd.sh). An unset
    # variable leaves an empty file, which denies everyone rather than opening
    # the app up.
    auth_basic "screenshot-to-code";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, resolved at request time so nginx starts even
    # when the backend container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /generate-code {
        set $upstream http://backend:7001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generations run for minutes with no client traffic.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        set $upstream http://backend:7001;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /local-assets/ {
        set $upstream http://backend:7001;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
